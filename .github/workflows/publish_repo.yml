name: Publish Kodi Repository

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: kodi-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ADDON_ID: plugin.kodi.jiotv
      SOURCE_REPOSITORY_ID: repository.jiotvdirect
      PAGES_OWNER: deepankar-siddharth
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: addon

      - name: Validate tag and source manifests
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "[FAIL] Tag is not a supported semantic version: $TAG" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-beta* ]]; then
            CHANNEL=beta
            REPOSITORY_ID="${SOURCE_REPOSITORY_ID}.beta"
            PAGES_PATH="beta"
          else
            CHANNEL=stable
            REPOSITORY_ID="${SOURCE_REPOSITORY_ID}"
            PAGES_PATH=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "repository_id=$REPOSITORY_ID" >> "$GITHUB_OUTPUT"
          echo "pages_path=$PAGES_PATH" >> "$GITHUB_OUTPUT"
          python3 addon/scripts/validate_release.py \
            --tag "$TAG" \
            --version "$VERSION" \
            --source-root addon \
            --source-repository-id "$SOURCE_REPOSITORY_ID" \
            --source-only

      - name: Prepare release trees
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY_ID: ${{ steps.release.outputs.repository_id }}
          PAGES_PATH: ${{ steps.release.outputs.pages_path }}
        run: |
          set -euo pipefail
          rm -rf temp temp_repo repo
          mkdir -p "temp/${ADDON_ID}" "temp_repo/${REPOSITORY_ID}" "repo/${ADDON_ID}" "repo/${REPOSITORY_ID}"

          # Copy visible source and then remove development/build-only material.
          cp -a addon/. "temp/${ADDON_ID}/"
          rm -rf \
            "temp/${ADDON_ID}/.git" \
            "temp/${ADDON_ID}/.github" \
            "temp/${ADDON_ID}/.agents" \
            "temp/${ADDON_ID}/.gitignore" \
            "temp/${ADDON_ID}/repository.jiotvdirect" \
            "temp/${ADDON_ID}/scripts" \
            "temp/${ADDON_ID}/scratch" \
            "temp/${ADDON_ID}/test_scripts" \
            "temp/${ADDON_ID}/kodi.log"
          find "temp/${ADDON_ID}" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "temp/${ADDON_ID}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          cp -a addon/repository.jiotvdirect/. "temp_repo/${REPOSITORY_ID}/"
          cp addon/LICENSE "temp_repo/${REPOSITORY_ID}/LICENSE"

          if [[ "$PAGES_PATH" == "beta" ]]; then
            sed -i \
              -e 's|id="repository.jiotvdirect"|id="repository.jiotvdirect.beta"|' \
              -e 's|name="JioTV Direct Repository (Community Fork)"|name="JioTV Direct Repository (Community Beta)"|' \
              -e 's|https://deepankar-siddharth.github.io/plugin.kodi.jiotv/|https://deepankar-siddharth.github.io/plugin.kodi.jiotv/beta/|g' \
              "temp_repo/${REPOSITORY_ID}/addon.xml"
            sed -i \
              's|https://deepankar-siddharth.github.io/plugin.kodi.jiotv/|https://deepankar-siddharth.github.io/plugin.kodi.jiotv/beta/|g' \
              "temp/${ADDON_ID}/addon.xml"
          fi

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          for path in ("temp/plugin.kodi.jiotv/addon.xml", os.path.join("temp_repo", os.environ["REPOSITORY_ID"], "addon.xml")):
              ET.parse(path)
          print("[PASS] Temporary manifests are valid XML")
          PY

      - name: Build and generate repository metadata
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY_ID: ${{ steps.release.outputs.repository_id }}
        run: |
          set -euo pipefail
          (cd temp && zip -q -r "../repo/${ADDON_ID}/${ADDON_ID}-${VERSION}.zip" "${ADDON_ID}")
          (cd temp_repo && zip -q -r "../repo/${REPOSITORY_ID}/${REPOSITORY_ID}-${VERSION}.zip" "${REPOSITORY_ID}")
          cp "repo/${REPOSITORY_ID}/${REPOSITORY_ID}-${VERSION}.zip" "repo/${REPOSITORY_ID}-${VERSION}.zip"

          mkdir -p "repo/${ADDON_ID}/resources" "repo/${REPOSITORY_ID}/resources"
          cp addon/resources/icon.png "repo/${ADDON_ID}/resources/icon.png"
          cp addon/resources/icon.png "repo/${ADDON_ID}/icon.png"
          if [[ -f addon/resources/fanart.png ]]; then
            cp addon/resources/fanart.png "repo/${ADDON_ID}/resources/fanart.png"
            cp addon/resources/fanart.png "repo/${ADDON_ID}/fanart.png"
          fi
          cp "temp_repo/${REPOSITORY_ID}/icon.png" "repo/${REPOSITORY_ID}/resources/icon.png"
          cp "temp_repo/${REPOSITORY_ID}/fanart.png" "repo/${REPOSITORY_ID}/resources/fanart.png"
          cp "temp_repo/${REPOSITORY_ID}/icon.png" "repo/${REPOSITORY_ID}/icon.png"
          cp "temp_repo/${REPOSITORY_ID}/fanart.png" "repo/${REPOSITORY_ID}/fanart.png"

          python3 addon/scripts/generate_repo.py \
            "$REPOSITORY_ID" \
            --version "$VERSION" \
            --output-dir repo

          python3 addon/scripts/validate_release.py \
            --tag "$GITHUB_REF_NAME" \
            --version "$VERSION" \
            --repository-id "$REPOSITORY_ID" \
            --source-repository-id "$SOURCE_REPOSITORY_ID" \
            --source-root addon \
            --output-dir repo \
            --addon-zip "repo/${ADDON_ID}/${ADDON_ID}-${VERSION}.zip" \
            --repository-zip "repo/${REPOSITORY_ID}/${REPOSITORY_ID}-${VERSION}.zip"

      - name: Deploy stable repository
        if: steps.release.outputs.channel == 'stable'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          keep_files: true

      - name: Deploy beta repository
        if: steps.release.outputs.channel == 'beta'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          destination_dir: beta
          keep_files: true

      - name: Verify published repository
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          REPOSITORY_ID: ${{ steps.release.outputs.repository_id }}
        run: |
          set -euo pipefail
          BASE="https://${PAGES_OWNER}.github.io/plugin.kodi.jiotv"
          if [[ "$CHANNEL" == "beta" ]]; then
            BASE="${BASE}/beta"
          fi
          required=(
            "addons.xml"
            "addons.xml.md5"
            "plugin.kodi.jiotv/plugin.kodi.jiotv-${VERSION}.zip"
            "${REPOSITORY_ID}/${REPOSITORY_ID}-${VERSION}.zip"
          )
          for attempt in 1 2 3 4 5 6; do
            ready=true
            for path in "${required[@]}"; do
              if ! curl --fail --silent --show-error --retry 2 --retry-delay 2 "${BASE}/${path}" -o /dev/null; then
                ready=false
                break
              fi
            done
            if [[ "$ready" == true ]]; then
              echo "[PASS] Published artifacts verified at ${BASE}"
              exit 0
            fi
            echo "Published files not ready (attempt ${attempt}/6); retrying..."
            sleep 10
          done
          echo "[FAIL] Expected published artifacts were not found under ${BASE}" >&2
          exit 1

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          ADDON_ZIP: repo/plugin.kodi.jiotv/plugin.kodi.jiotv-${{ steps.release.outputs.version }}.zip
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ADDON_ZIP" --clobber
          elif [[ "$CHANNEL" == "beta" ]]; then
            gh release create "$TAG" "$ADDON_ZIP" \
              --title "JioTV Direct ${TAG}" \
              --notes "Community-maintained beta release. Based on dineshintry/plugin.kodi.jiotv." \
              --prerelease
          else
            gh release create "$TAG" "$ADDON_ZIP" \
              --title "JioTV Direct ${TAG}" \
              --notes "Community-maintained release. Based on dineshintry/plugin.kodi.jiotv."
          fi
          echo "[PASS] GitHub Release is present with the addon ZIP"
